      THESIS: Agents are channels on a desk and every turn is a take on tape: drop a take (undo), send it to the
        other channel for a second listen (review), and the mixdown (save) has a clip light. Refuses the
        category's dark-IDE sidebar-chat-diff shell with one neon accent.
      OWN-WORLD: anodized charcoal panels, cream silkscreen labels in a condensed face, masking-tape scribble
        strips naming each agent, cap colours (clay for Claude, steel blue for Codex), LED ladder meters on one
        green-amber-red ramp, hairline rules, tabular figures. Flat; no knobs, no wood.
      STORY: A beginner asks, watches the take record, sees the files it touched as meters, plays the app on the
        monitor, drops a bad take, asks the other agent for a second listen, then mixes down safely.
      FIRST VIEWPORT: thin top rail (Kuvend, project, branch, mixdown with clip light); left rack of reels
        (sessions); centre tape lane of takes, newest at the bottom, talkback composer pinned beneath with the
        channel cap and a 3-position mode switch; right monitor (Changes, Run, Mixdown).
      FORM: Recording console, grounded list position 6, seed key 237f3d18.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
